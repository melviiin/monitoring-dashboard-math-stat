const { useState, useMemo, useEffect, useRef } = React;

function UserMenuPortal({ anchorRef, open, onClose, children }) {
  const [pos, setPos] = useState(null);

  useEffect(() => {
    if (!open) return;
    const update = () => {
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      setPos({ top: r.bottom + 8, right: Math.max(8, window.innerWidth - r.right) });
    };
    update();
    window.addEventListener("scroll", update, true);
    window.addEventListener("resize", update);
    return () => {
      window.removeEventListener("scroll", update, true);
      window.removeEventListener("resize", update);
    };
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const handleOutside = () => onClose();
    const handleEsc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("click", handleOutside);
    document.addEventListener("keydown", handleEsc);
    return () => {
      document.removeEventListener("click", handleOutside);
      document.removeEventListener("keydown", handleEsc);
    };
  }, [open, onClose]);

  if (!open || !pos) return null;

  return ReactDOM.createPortal(
    <div onClick={(e) => e.stopPropagation()} style={{ position: "fixed", top: pos.top, right: pos.right, zIndex: 1000 }}>
      {children}
    </div>,
    document.body
  );
}

  const setSlots = div==="Math"? setSlotsMath : setSlotsStat;

    const item = NAV.find(n=>n.key===key);
    if (item?.locked) { showToast("Modul "+item.label+" menyusul setelah KPI matang."); return; }
    setPage(key); window.scrollTo({top:0});
  };

  return (
    <div style={{ background:"var(--pageBg)", minHeight:"100vh" }}>
      <header style={{ position:"relative", overflow:"hidden", background:t.gradMast, color:"#fff", padding:"18px 24px 20px" }}>
        <div style={{ position:"absolute", top:-160, right:-80, width:380, height:380, borderRadius:999, pointerEvents:"none", background: theme==="dark"?"rgba(58,165,230,.12)":"rgba(255,255,255,.08)" }} />
        <div style={{ position:"relative", display:"flex", alignItems:"center", gap:18, flexWrap:"wrap" }}>
          <div>
            <div style={{ fontSize:16, fontWeight:700, letterSpacing:"-.01em" }}>prodi.monitor</div>
            <div style={{ fontSize:11.5, color:"rgba(255,255,255,.82)", marginTop:2 }}>Dept. Mathematics & Statistics · Bina Nusantara University</div>
          </div>
          <nav style={{ display:"flex", gap:8, marginLeft:20, flexWrap:"wrap" }}>
            {NAV.map(n=>{
              const active = page===n.key || (page==="cms" && n.key==="kpi");
              return <button key={n.key} onClick={()=>go(n.key)} title={n.locked?"Menyusul setelah KPI matang":""} style={{
                padding:"9px 17px", borderRadius:999, fontSize:12.5, fontWeight:600, lineHeight:1, border:0, cursor:"pointer",
                background: active? "#fff":"rgba(255,255,255,.16)", color: active? t.blueDeep : "rgba(255,255,255,.85)", transition:"all .15s",
                opacity: n.locked? .6 : 1,
              }}>{n.label}{n.locked? " · 🔒":""}</button>;
            })}
          </nav>
          <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:9 }}>
            <div style={{ display:"flex", background:"rgba(255,255,255,.16)", borderRadius:9, padding:3 }}>
              {["Math","Stat"].map(d=>(
                <button key={d} onClick={()=>setDiv(d)} style={{ padding:"6px 12px", borderRadius:7, border:0, cursor:"pointer", fontSize:11.5, fontWeight:700, background: div===d?"#fff":"transparent", color: div===d?t.blueDeep:"rgba(255,255,255,.85)" }}>{d==="Math"?"MAT":"STAT"}</button>
              ))}
            </div>
            {isAdmin && <button onClick={()=>{ setPage("cms"); window.scrollTo({top:0}); }} style={{ padding:"9px 15px", borderRadius:9, background: page==="cms"?"#fff":"rgba(255,255,255,.16)", color: page==="cms"?t.blueDeep:"#fff", fontSize:12.5, fontWeight:600, border:0, cursor:"pointer" }}>Atur KPI</button>}
            <ThemeToggle theme={theme} setTheme={setTheme} t={t} />
            <div style={{ position:"relative" }}>
              <button ref={userMenuRef} onClick={(e)=>{ e.stopPropagation(); setMenuOpen(o=>!o); }} style={{ display:"flex", alignItems:"center", gap:9, padding:"5px 13px 5px 5px", borderRadius:9, background:"rgba(255,255,255,.16)", border:0, cursor:"pointer", color:"inherit" }}>
                <span style={{ width:28, height:28, borderRadius:7, background:"#fff", color:t.blueDeep, display:"grid", placeItems:"center", fontSize:12, fontWeight:700 }}>{isAdmin?"AP":"DV"}</span>
                <span style={{ fontSize:10.5, fontWeight:700, letterSpacing:".08em", color:"rgba(255,255,255,.9)" }}>{isAdmin?"ADMIN":"VIEWER"}</span>
              </button>
              <UserMenuPortal anchorRef={userMenuRef} open={menuOpen} onClose={()=>setMenuOpen(false)}>
                <div style={{ background:t.panel, border:`1px solid ${t.bSoft}`, borderRadius:12, boxShadow:t.shCard, minWidth:200, padding:8, fontFamily:FONT_UI }}>
                  <div style={{ padding:"10px 12px", borderBottom:`1px solid ${t.bFaint}`, marginBottom:6 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:t.ink }}>{userName}</div>
                    <div style={{ fontSize:11.5, color:t.inkMuted, marginTop:2 }}>Role: {isAdmin?"ADMIN":"VIEWER"}</div>
                  </div>
                  {isAdmin && <button onClick={()=>{setMenuOpen(false); setPage("cms"); window.scrollTo({top:0});}} style={ddItem(t)}>Atur KPI dashboard</button>}
                  <button onClick={onLogout} style={ddItem(t)}>Keluar</button>
                </div>
              </UserMenuPortal>
            </div>
          </div>
        </div>
      </header>

      <div style={{ padding:"20px 24px 40px", color:"var(--ink)" }} onClick={()=>setMenuOpen(false)}>
        {page==="kpi" && <KpiDashboard div={div} rows={rows} slots={slots} onToast={showToast} />}
        {page==="cms" && isAdmin && <KpiCmsModule div={div} rows={rows} slots={slots} setSlots={setSlots} onToast={showToast} onBack={()=>setPage("kpi")} />}
        {page==="cms" && !isAdmin && <div style={{padding:40, textAlign:"center", color:"var(--inkMuted)"}}>Hanya admin yang dapat mengatur KPI.</div>}
      </div>

      <div style={{ position:"fixed", bottom:24, left:"50%", transform:`translateX(-50%) translateY(${toast?0:20}px)`, background:t.inkStrong, color:t.pageBg, padding:"12px 20px", borderRadius:10, fontSize:13, fontWeight:600, boxShadow:t.shCard, opacity:toast?1:0, pointerEvents:"none", transition:"opacity .2s, transform .2s", zIndex:900, maxWidth:"90vw", textAlign:"center" }}>{toast}</div>
    </div>
  );
}const ddItem = (t) => ({ display:"block", width:"100%", textAlign:"left", padding:"9px 12px", borderRadius:8, border:0, background:"none", fontSize:13, color:t.ink2, cursor:"pointer", fontFamily:FONT_UI });
// ============================================================
//  ROOT — Dashboard page only. Reads auth from localStorage
//  (written by login.html); redirects back to login.html if
//  missing. Same keys/behaviour as the team's existing
//  dashboard.html.
// ============================================================
function DashboardApp() {
  const [auth, setAuth] = useState(undefined); // undefined = checking, null = redirecting
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('prodi-monitor-theme') || 'light'; } catch (e) { return 'light'; }
  });

  useEffect(() => {
    let role = null, name = '';
    try {
      role = localStorage.getItem('prodi-monitor-role');
      name = localStorage.getItem('prodi-monitor-name') || '';
    } catch (e) {}
    if (!role) {
      window.location.href = 'login.html';
      setAuth(null);
      return;
    }
    setAuth({ role, name });
  }, []);

  const t = theme === 'dark' ? DARK : LIGHT;
  const cssVars = `--panel:${t.panel};--panelAlt:${t.panelAlt};--panelRow:${t.panelRow};--pageBg:${t.pageBg};--inputBg:${t.inputBg};--ink:${t.ink};--ink2:${t.ink2};--inkMuted:${t.inkMuted};--inkFaint:${t.inkFaint};--blue:${t.blue};--blueDeep:${t.blueDeep};--orange:${t.orange};--link:${t.link};--okBg:${t.okBg};--okFg:${t.okFg};--okDot:${t.okDot};--warnBg:${t.warnBg};--warnFg:${t.warnFg};--warnFgS:${t.warnFgS};--warnChip:${t.warnChip};--danger:${t.danger};--bFaint:${t.bFaint};--bSoft:${t.bSoft};--gradKpi:${t.gradKpi}`;
  const styleTag = `
    @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
    .pm-root{${cssVars}}
    @keyframes pm-pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .pm-root *{box-sizing:border-box}
    .pm-root ::selection{background:${t.blue};color:#fff}
    @media (max-width:980px){ .pm-root .pm-statgrid{grid-template-columns:1fr 1fr !important} .pm-root .pm-kpicat{grid-template-columns:1fr 1fr !important} }
    @media (max-width:900px){ .pm-root .pm-row2{grid-template-columns:1fr !important} }
    @media (max-width:560px){ .pm-root .pm-statgrid{grid-template-columns:1fr !important} .pm-root .pm-kpicat{grid-template-columns:1fr !important} }
  `;

  const handleTheme = (mode) => {
    setTheme(mode);
    try { localStorage.setItem('prodi-monitor-theme', mode); } catch (e) {}
  };

  const handleLogout = () => {
    try {
      localStorage.removeItem('prodi-monitor-role');
      localStorage.removeItem('prodi-monitor-name');
    } catch (e) {}
    window.location.href = 'login.html';
  };

  if (!auth) return null; // brief blank frame while checking localStorage / redirecting

  return (
    <div className="pm-root" style={{ fontFamily: FONT_UI, background: t.bgPage, minHeight: "100vh", color: t.ink, transition: "background .25s" }}>
      <style>{styleTag}</style>
      <AppShell role={auth.role} userName={auth.name} theme={theme} setTheme={handleTheme} onLogout={handleLogout} t={t} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DashboardApp));

</script>

<script>
(function () {
  try {
    var source = document.getElementById('app-source').textContent;
    var compiled = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]]
    }).code;
    var factory = new Function('React', compiled);
    factory(React);
  } catch (err) {
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    box.textContent = 'Gagal memuat aplikasi:\n' + (err && err.stack ? err.stack : err);
    console.error(err);
  }
})();
</script>
</body>
</html>
