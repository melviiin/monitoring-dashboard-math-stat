const { useState, useMemo, useEffect, useRef } = React;

function UserMenuPortal({ anchorRef, open, onClose, children }) {
  const [pos, setPos] = useState(null);

  useEffect(() => {
    if (!open) return;
    const update = () => {
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      setPos({ top: r.bottom + 8, right: Math.max(8, window.innerWidth - r.right) });
    };
    update();
    window.addEventListener("scroll", update, true);
    window.addEventListener("resize", update);
    return () => {
      window.removeEventListener("scroll", update, true);
      window.removeEventListener("resize", update);
    };
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const handleOutside = () => onClose();
    const handleEsc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("click", handleOutside);
    document.addEventListener("keydown", handleEsc);
    return () => {
      document.removeEventListener("click", handleOutside);
      document.removeEventListener("keydown", handleEsc);
    };
  }, [open, onClose]);

  if (!open || !pos) return null;

  return ReactDOM.createPortal(
    <div onClick={(e) => e.stopPropagation()} style={{ position: "fixed", top: pos.top, right: pos.right, zIndex: 1000 }}>
      {children}
    </div>,
    document.body
  );
}

var API = (typeof window!=="undefined" && window.__API_BASE) ? window.__API_BASE : "http://localhost:5000";
var THN = (typeof window!=="undefined" && window.__TAHUN) ? window.__TAHUN : 2026;

async function apiFetch(pathname, opts){
  var url = API + pathname;
  var res = await fetch(url, Object.assign({
    headers: { "Content-Type": "application/json" }
  }, opts||{}));
  var body = null;
  try { body = await res.json(); } catch(e){ body = null; }
  if (!res.ok) {
    var msg = (body && body.error) ? body.error : ("HTTP "+res.status);
    throw new Error(msg);
  }
  return body;
}

// Baca file (xlsx/csv) -> array of objects (header baris pertama).
function readSheetFile(file){
  return new Promise(function(resolve, reject){
    if (typeof XLSX === "undefined") { reject(new Error("Library Excel belum termuat.")); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type:"array" });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { defval:null });
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror = function(){ reject(new Error("Gagal membaca file.")); };
    reader.readAsArrayBuffer(file);
  });
}

// Normalisasi 1 baris sheet -> payload KPI backend. Header fleksibel
// (dibuat cocok dengan hasil Download: No, Kode, Indikator, Perspektif,
//  Satuan, Realisasi, Target, Bobot, PIC, Divisi/Div).
function rowToKpiPayload(row, fallbackDiv){
  function g(){ for (var i=0;i<arguments.length;i++){ var k=arguments[i]; if (row[k]!==undefined && row[k]!==null && row[k]!=="") return row[k]; } return null; }
  var perspRaw = g("Perspektif","perspektif","p","P");
  var pMap = { "capacity building":"CBE","capacity building and execution":"CBE","enabler":"ENB","economic growth":"ECO","recognition":"REC","cbe":"CBE","enb":"ENB","eco":"ECO","rec":"REC" };
  var p = perspRaw ? (pMap[String(perspRaw).toLowerCase().trim()] || String(perspRaw).toUpperCase()) : "CBE";
  var divRaw = g("Divisi","Div","div","prodi","Prodi");
  var div = fallbackDiv || "Math";
  if (divRaw){ var d=String(divRaw).toLowerCase(); div = (d.indexOf("stat")>=0)?"Stat":"Math"; }
  var typeRaw = g("Tipe","type","Type");
  var type = typeRaw ? (String(typeRaw).toUpperCase().indexOf("L")===0 || String(typeRaw).toLowerCase().indexOf("qualit")>=0 ? "L":"Q") : "Q";
  return {
    div: div, p: p,
    goal: g("Goal","goal","Tujuan"),
    code: g("Kode","code","Kode PI","kode_pi") || "",
    name: g("Indikator","name","Nama Indikator","indikator"),
    unit: g("Satuan","unit") || "",
    type: type,
    fokus: 0, prereq: 0,
    bobot: g("Bobot","bobot"),
    target: g("Target","target","target_all"),
    real: g("Realisasi","real","nilai","Nilai"),
    no: g("No","no","no_urut") || 0
  };
}

function rowToAkunPayload(row){
  function g(){ for (var i=0;i<arguments.length;i++){ var k=arguments[i]; if (row[k]!==undefined && row[k]!==null && row[k]!=="") return row[k]; } return null; }
  return {
    username: g("username","Username","email","Email"),
    name: g("name","Nama","nama","Nama Lengkap") || g("username","Username","email","Email"),
    role: (String(g("role","Role")||"viewer").toLowerCase()==="admin") ? "admin":"viewer",
    nidn: g("nidn","NIDN") || "",
    password: g("password","Password") || ""
  };
}

function downloadKpiXlsx(r, divName, onToast){
  if (typeof XLSX === "undefined") { onToast && onToast("Library Excel belum termuat, coba lagi sebentar."); return; }
  try {
    // Sheet 1: ringkasan KPI
    const info = [
      ["Prodi", divName],
      ["Kode PI", r.code || "—"],
      ["Indikator", r.name],
      ["Perspektif", (PERSP_META[r.p]||{}).label || r.p],
      ["Goal", r.goal || "—"],
      ["Satuan", r.unit],
      ["Bobot", r.bobot],
      ["PIC", r.prov || "—"],
      [],
      ["Realisasi", r.type==="L"? "—" : r.real],
      ["Target", r.target],
      ["% ke target", (r.real!=null && r.target)? Math.round(r.real/r.target*100)+"%" : "—"],
      ["Skor capaian", r.score==null? "—" : r.score+" / 6"],
      ["Status", r.score==null? "—" : bandLabel(scoreBand(r.score)==="red"?0:scoreBand(r.score)==="orange"?1:3)],
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(info);
    ws1["!cols"] = [{wch:16},{wch:52}];

    // Sheet 2: rentang skor (band) 1-6
    const bandRows = [["Skor","Rentang Min","Rentang Max","Status","Aktual?"]];
    (r.ranges||[]).forEach((pair,i)=>{
      bandRows.push([ i+1, pair? pair[0]:"", pair? pair[1]:"", bandLabel(i), (i+1)===r.score? "◀ realisasi di sini":"" ]);
    });
    const ws2 = XLSX.utils.aoa_to_sheet(bandRows);
    ws2["!cols"] = [{wch:6},{wch:16},{wch:16},{wch:20},{wch:20}];

    // Sheet 3: realisasi per bulan (kalau ada; prototipe pakai target kuartal sbg placeholder)
    const monthRows = [["Bulan","Realisasi (kumulatif)"]];
    // prototipe: kita hanya punya realisasi akhir; isi bulan terakhir saja
    MONTHS.forEach((m,i)=>{ monthRows.push([m, i===5 && r.type!=="L"? r.real : ""]); }); // Jun = periode data
    const ws3 = XLSX.utils.aoa_to_sheet(monthRows);

  const filled = slots.filter(x=>x!=null).length;

  const perspStat = PERSP_ORDER.map(p=>{
    const g = rows.filter(r=>r.p===p);
    const gScored = g.filter(r=>r.score!=null);
    const gGreen = gScored.filter(r=>scoreBand(r.score)==="green").length;
    return { p, meta:PERSP_META[p], total:g.length, achieved:gGreen, scored:gScored.length };
  });
  const divName = div==="Math"?"Matematika":"Statistika";

  return (
    <>
      <ContentHead sync={`RINGKASAN · ${divName.toUpperCase()} 2026 · JUNI (Q2)`} title="Summary">
        <button onClick={()=>onNav({key:"kpi"})} style={exportBtn}>Buka Dashboard →</button>
      </ContentHead>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, marginTop:18 }} className="pm-statgrid">
        <StatCard label="Total KPI" num={rows.length} foot={`${scored.length} sudah terukur · ${rows.length-scored.length} menunggu data`} />
        <StatCard label="Tercapai (zona hijau)" num={green} foot={`${rows.length? Math.round(green/scored.length*100):0}% dari KPI terukur di zona hijau`} />
        <StatCard label="Skor tertimbang" num={weighted? weighted.toFixed(2):"—"} foot="Rata-rata skor 1–6 dibobot bobot KPI" />
        <StatCard label="Slot dashboard" num={`${filled}/${SLOT_COUNT}`} foot="Slot KPI yang dipilih admin untuk tampil" />
      </div>

      <Panel style={{ marginTop:14 }}>
        <PanelHead eyebrow="4 PERSPEKTIF" title="Capaian per perspektif" hint="pengelompokan KPI mengikuti Binus Rectorate KPI" right={<VarChip>SUMMARY BSC</VarChip>} />
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, marginTop:16 }} className="pm-kpicat">
          {perspStat.map(s=>{
            const pct = s.scored? Math.round(s.achieved/s.scored*100):0;
            return (
              <div key={s.p} style={{ borderRadius:14, background:"var(--panelAlt)", padding:16, borderTop:`3px solid ${s.meta.color}` }}>
                <div style={{ fontSize:11, fontWeight:700, letterSpacing:".04em", color:s.meta.color }}>{s.meta.short.toUpperCase()}</div>
                <div style={{ fontSize:12, color:"var(--inkMuted)", marginTop:3, minHeight:32, lineHeight:1.3 }}>{s.meta.label}</div>
                <div style={{ display:"flex", alignItems:"baseline", gap:5, marginTop:8 }}>
                  <span style={{ fontSize:30, fontWeight:700, letterSpacing:"-.02em", color:"var(--ink)" }}>{s.achieved}</span>
                  <span style={{ fontSize:13, color:"var(--inkMuted)" }}>/ {s.total} KPI hijau</span>
                </div>
                <div style={{ height:6, borderRadius:3, background:"var(--panelRow)", overflow:"hidden", marginTop:9 }}>
                  <div style={{ height:6, width:`${pct}%`, background:s.meta.color }} />
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ marginTop:14, padding:"11px 13px", borderRadius:10, background:"var(--panelAlt)", fontSize:12, lineHeight:1.55, color:"var(--ink2)" }}>
          <b style={{color:"var(--ink)"}}>Fokus prioritas:</b> Intake &amp; Active Student (Economic Growth) dan Publikasi FM/MHS (Capacity Building) — sesuai arahan monitoring. Data ditarik sampai <b>Juni (akhir Q2)</b> sebagai periode review.
        </div>
      </Panel>
    </>
  );

function ConfirmModal({ open, title, message, onConfirm, onCancel }) {
  if (!open) return null;
  return ReactDOM.createPortal(
    <div onClick={onCancel} style={{ position:"fixed", inset:0, zIndex:1300, background:"rgba(0,0,0,.5)", display:"grid", placeItems:"center", padding:20 }}>
      <div onClick={e=>e.stopPropagation()} style={{ width:"min(420px,100%)", background:"var(--panel)", borderRadius:16, boxShadow:"0 24px 70px rgba(0,0,0,.4)", padding:24 }}>
        <div style={{ fontSize:17, fontWeight:700, color:"var(--ink)" }}>{title}</div>
        <p style={{ fontSize:13, color:"var(--inkMuted)", lineHeight:1.6, margin:"10px 0 20px" }}>{message}</p>
        <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
          <button onClick={onCancel} style={{ ...miniAction, background:"var(--inputBg)", color:"var(--ink)", padding:"9px 18px" }}>Batal</button>
          <button onClick={onConfirm} style={{ ...miniAction, background:"var(--danger)", color:"#fff", padding:"9px 18px" }}>Hapus</button>
        </div>
      </div>
    </div>, document.body
  );
}

function KpiFormModal({ open, onClose, onSave, initial, divFilter }) {
  const empty = { no:"", div:divFilter||"Math", p:"ECO", goal:"", code:"", name:"", unit:"Persentase", type:"Q", fokus:0, prereq:0, bobot:0, target:null, real:null, score:null, prov:"" };
  const [form, setForm] = useState(initial || empty);
  useEffect(()=>{ setForm(initial || { ...empty, div:divFilter||"Math" }); }, [initial, open]);
  if (!open) return null;
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const isEdit = !!initial;
  const handleSave = () => {
    if (!form.name.trim()) return;
    const cleaned = {
      ...form,
      no: parseInt(form.no)||0,
      bobot: parseFloat(form.bobot)||0,
      target: form.target===""||form.target==null? null : parseFloat(form.target),
      real: form.real===""||form.real==null? null : parseFloat(form.real),
      score: form.score===""||form.score==null? null : parseInt(form.score),
      fokus: form.fokus?1:0,
      prereq: form.prereq?1:0,
      tq:[null,null,null, form.target===""||form.target==null? null : parseFloat(form.target)],
      ranges: form.ranges || [null,null,null,null,null,null],
    };
    onSave(cleaned);
  };
  const inputStyle = { width:"100%", height:38, padding:"0 12px", borderRadius:8, border:0, background:"var(--inputBg)", color:"var(--ink)", fontFamily:FONT_UI, fontSize:13, outline:"none" };
  const labelStyle = { fontSize:11.5, fontWeight:700, color:"var(--inkMuted)", marginBottom:4, display:"block" };
  const selectStyle = { ...inputStyle, cursor:"pointer" };

  return ReactDOM.createPortal(
    <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:1200, background:"rgba(0,0,0,.5)", display:"grid", placeItems:"center", padding:20 }}>
      <div onClick={e=>e.stopPropagation()} className="pm-root" style={{ width:"min(620px,100%)", maxHeight:"88vh", overflowY:"auto", background:"var(--panel)", borderRadius:18, boxShadow:"0 24px 70px rgba(0,0,0,.4)", padding:24 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div style={{ fontSize:17, fontWeight:700, color:"var(--ink)" }}>{isEdit?"Edit KPI":"Tambah KPI Baru"}</div>
          <button onClick={onClose} style={{ width:32, height:32, borderRadius:8, border:0, cursor:"pointer", background:"var(--inputBg)", color:"var(--ink)", fontSize:16 }}>×</button>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <div><label style={labelStyle}>No Urut</label><input value={form.no} onChange={e=>set("no",e.target.value)} type="number" style={inputStyle} placeholder="1" /></div>
          <div><label style={labelStyle}>Divisi</label>
            <select value={form.div} onChange={e=>set("div",e.target.value)} style={selectStyle}>
              <option value="Math">Mathematics</option><option value="Stat">Statistics</option>
            </select>
          </div>
        </div>

        <div style={{ marginTop:12 }}><label style={labelStyle}>Nama Indikator *</label><input value={form.name} onChange={e=>set("name",e.target.value)} style={inputStyle} placeholder="Masukkan nama indikator KPI" /></div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginTop:12 }}>
          <div><label style={labelStyle}>Kode PI</label><input value={form.code} onChange={e=>set("code",e.target.value)} style={inputStyle} placeholder="mis. G4.1.A.1" /></div>
          <div><label style={labelStyle}>Perspektif</label>
            <select value={form.p} onChange={e=>set("p",e.target.value)} style={selectStyle}>
              {PERSP_ORDER.map(p=><option key={p} value={p}>{PERSP_META[p].label}</option>)}
            </select>
          </div>
        </div>

        <div style={{ marginTop:12 }}><label style={labelStyle}>Goal</label><input value={form.goal||""} onChange={e=>set("goal",e.target.value)} style={inputStyle} placeholder="mis. 4. Student Numbers (G4)" /></div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginTop:12 }}>
          <div><label style={labelStyle}>Satuan</label><input value={form.unit} onChange={e=>set("unit",e.target.value)} style={inputStyle} placeholder="Persentase" /></div>
          <div><label style={labelStyle}>Tipe</label>
            <select value={form.type} onChange={e=>set("type",e.target.value)} style={selectStyle}>
              <option value="Q">Quantitative</option><option value="L">Qualitative (Level)</option>
            </select>
          </div>
          <div><label style={labelStyle}>Bobot</label><input value={form.bobot} onChange={e=>set("bobot",e.target.value)} type="number" step="0.01" style={inputStyle} /></div>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginTop:12 }}>
          <div><label style={labelStyle}>Target</label><input value={form.target==null?"":form.target} onChange={e=>set("target",e.target.value)} type="number" step="any" style={inputStyle} /></div>
          <div><label style={labelStyle}>Realisasi</label><input value={form.real==null?"":form.real} onChange={e=>set("real",e.target.value)} type="number" step="any" style={inputStyle} /></div>
          <div><label style={labelStyle}>Skor (1–6)</label><input value={form.score==null?"":form.score} onChange={e=>set("score",e.target.value)} type="number" min="1" max="6" style={inputStyle} /></div>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginTop:12 }}>
          <div><label style={labelStyle}>PIC</label><input value={form.prov||""} onChange={e=>set("prov",e.target.value)} style={inputStyle} placeholder="Nama penanggung jawab" /></div>
          <div style={{ display:"flex", gap:18, alignItems:"flex-end", paddingBottom:6 }}>
            <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:13, color:"var(--ink)", cursor:"pointer" }}>
              <input type="checkbox" checked={!!form.fokus} onChange={e=>set("fokus",e.target.checked?1:0)} /> PI Fokus
            </label>
            <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:13, color:"var(--ink)", cursor:"pointer" }}>
              <input type="checkbox" checked={!!form.prereq} onChange={e=>set("prereq",e.target.checked?1:0)} /> Prerequisite
            </label>
          </div>
        </div>

        <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20, borderTop:"1px solid var(--bFaint)", paddingTop:16 }}>
          <button onClick={onClose} style={{ ...miniAction, background:"var(--inputBg)", color:"var(--ink)", padding:"10px 20px", fontSize:13 }}>Batal</button>
          <button onClick={handleSave} style={{ ...miniAction, background:"var(--blue)", color:"#fff", padding:"10px 20px", fontSize:13 }}>{isEdit?"Simpan Perubahan":"Tambah KPI"}</button>
        </div>
      </div>
    </div>, document.body
  );
}

function KpiCrudModule({ div, allRows, setAllRows, onToast }) {
  const [q, setQ] = useState("");
  const [persp, setPersp] = useState("ALL");
  const [formOpen, setFormOpen] = useState(false);
  const [editRow, setEditRow] = useState(null);
  const [delTarget, setDelTarget] = useState(null);

  const rows = allRows.filter(r=>r.div===div);
  const filtered = rows.filter(r=>{
    if (persp!=="ALL" && r.p!==persp) return false;
    if (q && !(`${r.code} ${r.name} ${r.prov}`.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  });
  const divName = div==="Math"?"Matematika":"Statistika";

  const handleAdd = () => { setEditRow(null); setFormOpen(true); };
  const handleEdit = (r) => { setEditRow(r); setFormOpen(true); };
  const handleSave = async (data) => {
    try {
      if (editRow) {
        const id = editRow.id_kpi;
        if (id != null) {
          const res = await apiFetch("/api/kpi/" + id + "?tahun=" + THN, { method:"PUT", body: JSON.stringify(data) });
          const saved = (res && res.row) ? res.row : { ...data, id_kpi:id };
          setAllRows(prev => prev.map(r => r===editRow ? { ...saved, ranges:editRow.ranges||saved.ranges } : r));
        } else {
          setAllRows(prev => prev.map(r => r===editRow ? { ...data, ranges:editRow.ranges||data.ranges } : r));
        }
        onToast("KPI berhasil diperbarui.");
      } else {
        const res = await apiFetch("/api/kpi?tahun=" + THN, { method:"POST", body: JSON.stringify(data) });
        const saved = (res && res.row) ? res.row : data;
        setAllRows(prev => [...prev, { ...saved, ranges:saved.ranges||[null,null,null,null,null,null] }]);
        onToast("KPI baru berhasil ditambahkan.");
      }
      setFormOpen(false); setEditRow(null);
    } catch(err){
      onToast("Gagal menyimpan ke server: " + err.message);
    }
  };
  const handleDelete = async () => {
    if (!delTarget) return;
    try {
      if (delTarget.id_kpi != null) {
        await apiFetch("/api/kpi/" + delTarget.id_kpi, { method:"DELETE" });
      }
      setAllRows(prev => prev.filter(r => r!==delTarget));
      onToast("KPI \""+delTarget.name+"\" berhasil dihapus.");
      setDelTarget(null);
    } catch(err){
      onToast("Gagal menghapus di server: " + err.message);
      setDelTarget(null);
    }
  };
  const handleUpload = async (file) => {
    if (!file) return;
    try {
      onToast("Membaca file…");
      const raw = await readSheetFile(file);
      if (!raw || raw.length===0) { onToast("File kosong atau format tidak dikenali."); return; }
      const importRows = raw.map(r => rowToKpiPayload(r, div)).filter(r => r.name && String(r.name).trim());
      if (importRows.length===0) { onToast("Tidak ada baris valid (kolom 'Indikator' wajib ada)."); return; }
      const res = await apiFetch("/api/kpi/import?tahun=" + THN, { method:"POST", body: JSON.stringify({ rows: importRows, tahun: THN }) });
      onToast("Import: " + (res.inserted||0) + " baru, " + (res.updated||0) + " diperbarui" + (res.failed? ", " + res.failed + " gagal":"") + ". Muat ulang halaman untuk melihat.");
    } catch(err){
      onToast("Gagal import: " + err.message);
    }
  };

  return (
    <>
      <ContentHead sync={`KELOLA DATA KPI · ${divName.toUpperCase()} · ${rows.length} INDIKATOR`} title="Kelola Data KPI">
        <label style={{ ...exportBtn, cursor:"pointer" }} title="Upload data KPI dari file Excel/CSV">
          Upload
          <input type="file" accept=".xlsx,.xls,.csv" style={{ display:"none" }}
            onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) handleUpload(f); }} />
        </label>
        <button onClick={handleAdd} style={{ ...exportBtn, marginLeft:8, background:"var(--blue)", color:"#fff", fontWeight:700 }}>+ Tambah KPI</button>
      </ContentHead>
      <p style={{ margin:"10px 0 0", fontSize:13, lineHeight:1.6, color:"var(--ink2)" }}>
        Kelola data indikator KPI secara langsung. Tambah indikator baru, edit data realisasi/target, atau hapus indikator yang sudah tidak relevan. Perubahan langsung tercermin di Dashboard dan CMS.
      </p>

      <Panel style={{ marginTop:16 }}>
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari kode / indikator / PIC…" style={{
            flex:"1 1 240px", height:40, padding:"0 14px", borderRadius:9, border:"1px solid var(--bSoft)",
            background:"var(--inputBg)", color:"var(--ink)", fontSize:13, fontFamily:FONT_UI }} />
          <div style={{ display:"flex", gap:3, padding:3, borderRadius:9, background:"var(--inputBg)", flexWrap:"wrap" }}>
            {["ALL",...PERSP_ORDER].map(p=>(
              <button key={p} onClick={()=>setPersp(p)} style={{ padding:"7px 12px", borderRadius:7, border:0, cursor:"pointer",
                fontSize:11.5, fontWeight:persp===p?700:600, fontFamily:FONT_UI,
                background:persp===p?"var(--panel)":"transparent", color:persp===p?"var(--ink)":"var(--inkMuted)" }}>
                {p==="ALL"?"Semua":PERSP_META[p].short}</button>
            ))}
          </div>
          <span style={{ fontSize:12, color:"var(--inkMuted)" }}>{filtered.length} ditampilkan</span>
        </div>

        <div style={{ overflowX:"auto" }}>
          <div style={{ minWidth:860 }}>
            <div style={{ display:"grid", gridTemplateColumns:"42px 80px 1fr 80px 80px 50px 90px", gap:8, padding:"0 10px 8px", fontSize:10.5, fontWeight:700, letterSpacing:".05em", color:"var(--inkFaint)" }}>
              <span>NO</span><span>KODE</span><span>INDIKATOR</span><span style={{textAlign:"right"}}>REAL</span><span style={{textAlign:"right"}}>TARGET</span><span style={{textAlign:"right"}}>SKOR</span><span style={{textAlign:"right"}}>AKSI</span>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
              {filtered.map((r,i)=>(
                <div key={i} style={{ display:"grid", gridTemplateColumns:"42px 80px 1fr 80px 80px 50px 90px", gap:8, alignItems:"center", padding:"10px 10px", borderRadius:9, fontSize:12.5, color:"var(--ink)", background:i%2?"var(--panel)":"var(--panelAlt)" }}>
                  <span style={{ color:"var(--inkFaint)" }}>{r.no}</span>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10.5, color:"var(--inkMuted)" }}>{r.code||"—"}</span>
                  <span style={{ fontWeight:600, lineHeight:1.3 }}>{r.name}
                    <span style={{ marginLeft:6, fontSize:10, fontWeight:700, color:PERSP_META[r.p].color }}>{PERSP_META[r.p].short}</span>
                    {r.fokus?<span style={{ marginLeft:5, fontSize:9, padding:"2px 5px", borderRadius:4, background:"var(--okBg)", color:"var(--okFg)", fontWeight:700 }}>FOKUS</span>:""}
                  </span>
                  <span style={{ textAlign:"right" }}>{r.type==="L"?"—":idr(r.real)}</span>
                  <span style={{ textAlign:"right", color:"var(--inkMuted)" }}>{idr(r.target)}</span>
                  <span style={{ textAlign:"right" }}><ScoreDot score={r.score} /></span>
                  <span style={{ textAlign:"right", display:"flex", gap:5, justifyContent:"flex-end" }}>
                    <button onClick={()=>handleEdit(r)} title="Edit" style={{ width:30, height:28, borderRadius:6, border:0, cursor:"pointer", background:"var(--inputBg)", color:"var(--blue)", fontSize:13 }}>✎</button>
                    <button onClick={()=>setDelTarget(r)} title="Hapus" style={{ width:30, height:28, borderRadius:6, border:0, cursor:"pointer", background:"var(--warnBg)", color:"var(--danger)", fontSize:13 }}>✕</button>
                  </span>
                </div>
              ))}
              {filtered.length===0 && <div style={{ padding:"30px 0", textAlign:"center", color:"var(--inkMuted)", fontSize:13 }}>Tidak ada data KPI yang cocok.</div>}
            </div>
          </div>
        </div>
      </Panel>

      <KpiFormModal open={formOpen} onClose={()=>{setFormOpen(false);setEditRow(null);}} onSave={handleSave} initial={editRow} divFilter={div} />
      <ConfirmModal open={!!delTarget} title="Hapus KPI" message={delTarget? `Apakah Anda yakin ingin menghapus indikator "${delTarget.name}"? Tindakan ini tidak dapat dibatalkan.` : ""} onConfirm={handleDelete} onCancel={()=>setDelTarget(null)} />
    </>
  );
}

const INITIAL_USERS = [
  { username:"admin", name:"Kaprodi / Staf TU", role:"admin", nidn:"" },
  { username:"viewer", name:"Dr. Rina Wijayanti", role:"viewer", nidn:"0987654321" },
];

function UserFormModal({ open, onClose, onSave, initial }) {
  const empty = { username:"", name:"", role:"viewer", nidn:"", password:"" };
  const [form, setForm] = useState(initial ? { ...initial, password:"" } : empty);
  useEffect(()=>{ setForm(initial ? { ...initial, password:"" } : empty); }, [initial, open]);
  if (!open) return null;
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const isEdit = !!initial;
  const handleSave = () => {
    if (!form.username.trim() || !form.name.trim()) return;
    if (!isEdit && !form.password.trim()) return;
    onSave(form);
  };
  const inputStyle = { width:"100%", height:38, padding:"0 12px", borderRadius:8, border:0, background:"var(--inputBg)", color:"var(--ink)", fontFamily:FONT_UI, fontSize:13, outline:"none" };
  const labelStyle = { fontSize:11.5, fontWeight:700, color:"var(--inkMuted)", marginBottom:4, display:"block" };

  return ReactDOM.createPortal(
    <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:1200, background:"rgba(0,0,0,.5)", display:"grid", placeItems:"center", padding:20 }}>
      <div onClick={e=>e.stopPropagation()} className="pm-root" style={{ width:"min(480px,100%)", background:"var(--panel)", borderRadius:18, boxShadow:"0 24px 70px rgba(0,0,0,.4)", padding:24 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div style={{ fontSize:17, fontWeight:700, color:"var(--ink)" }}>{isEdit?"Edit Akun":"Tambah Akun Baru"}</div>
          <button onClick={onClose} style={{ width:32, height:32, borderRadius:8, border:0, cursor:"pointer", background:"var(--inputBg)", color:"var(--ink)", fontSize:16 }}>×</button>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <div><label style={labelStyle}>Username *</label><input value={form.username} onChange={e=>set("username",e.target.value)} style={inputStyle} placeholder="username" disabled={isEdit} /></div>
          <div><label style={labelStyle}>Nama Lengkap *</label><input value={form.name} onChange={e=>set("name",e.target.value)} style={inputStyle} placeholder="Dr. Nama Lengkap" /></div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginTop:12 }}>
          <div><label style={labelStyle}>Role</label>
            <select value={form.role} onChange={e=>set("role",e.target.value)} style={{ ...inputStyle, cursor:"pointer" }}>
              <option value="admin">ADMIN</option><option value="viewer">VIEWER</option>
            </select>
          </div>
          <div><label style={labelStyle}>NIDN (opsional, untuk dosen)</label><input value={form.nidn||""} onChange={e=>set("nidn",e.target.value)} style={inputStyle} placeholder="0987654321" /></div>
        </div>
        <div style={{ marginTop:12 }}><label style={labelStyle}>{isEdit?"Password Baru (kosongkan jika tidak diubah)":"Password *"}</label><input value={form.password} onChange={e=>set("password",e.target.value)} type="password" style={inputStyle} placeholder={isEdit?"••••••••":"Masukkan password"} /></div>

        <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20, borderTop:"1px solid var(--bFaint)", paddingTop:16 }}>
          <button onClick={onClose} style={{ ...miniAction, background:"var(--inputBg)", color:"var(--ink)", padding:"10px 20px", fontSize:13 }}>Batal</button>
          <button onClick={handleSave} style={{ ...miniAction, background:"var(--blue)", color:"#fff", padding:"10px 20px", fontSize:13 }}>{isEdit?"Simpan":"Tambah Akun"}</button>
        </div>
      </div>
    </div>, document.body
  );
}

function UserCrudModule({ onToast }) {
  const [users, setUsers] = useState(()=>{
    try { const s=localStorage.getItem("prodi-monitor-users"); return s? JSON.parse(s):INITIAL_USERS; } catch(e){ return INITIAL_USERS; }
  });
  const [dbMode, setDbMode] = useState(false); // true kalau tabel akun ada di DB
  // muat daftar akun dari backend saat modul dibuka; fallback ke localStorage kalau gagal
  const loadUsers = React.useCallback(async ()=>{
    try {
      const res = await apiFetch("/api/akun");
      if (res && res.table && Array.isArray(res.users)) {
        setUsers(res.users.map(u=>({ username:u.username, name:u.name||u.username, role:u.role, nidn:u.nidn||"" })));
        setDbMode(true);
      } else {
        setDbMode(false); // tabel belum ada -> tetap pakai localStorage
      }
    } catch(e){ setDbMode(false); }
  }, []);
  useEffect(()=>{ loadUsers(); }, [loadUsers]);
  useEffect(()=>{ if(!dbMode){ try { localStorage.setItem("prodi-monitor-users", JSON.stringify(users)); } catch(e){} } }, [users, dbMode]);
  const [formOpen, setFormOpen] = useState(false);
  const [editUser, setEditUser] = useState(null);
  const [delTarget, setDelTarget] = useState(null);
  const [q, setQ] = useState("");

  const filtered = users.filter(u => !q || `${u.username} ${u.name} ${u.nidn||""}`.toLowerCase().includes(q.toLowerCase()));

  const handleAdd = () => { setEditUser(null); setFormOpen(true); };
  const handleEdit = (u) => { setEditUser(u); setFormOpen(true); };
  const handleSave = async (data) => {
    try {
      if (editUser) {
        if (dbMode) {
          await apiFetch("/api/akun/" + encodeURIComponent(editUser.username), { method:"PUT", body: JSON.stringify(data) });
        }
        setUsers(prev => prev.map(u => u.username===editUser.username ? { ...u, name:data.name, role:data.role, nidn:data.nidn } : u));
        onToast("Akun \""+data.username+"\" berhasil diperbarui.");
      } else {
        if (users.find(u=>u.username===data.username)) { onToast("Username sudah ada."); return; }
        if (dbMode) {
          await apiFetch("/api/akun", { method:"POST", body: JSON.stringify(data) });
        }
        setUsers(prev => [...prev, { username:data.username, name:data.name, role:data.role, nidn:data.nidn||"" }]);
        onToast("Akun \""+data.username+"\" berhasil ditambahkan.");
      }
      setFormOpen(false); setEditUser(null);
    } catch(err){
      onToast("Gagal menyimpan akun: " + err.message);
    }
  };
  const handleDelete = async () => {
    if (!delTarget) return;
    if (delTarget.username==="admin") { onToast("Akun admin utama tidak dapat dihapus."); setDelTarget(null); return; }
    try {
      if (dbMode) {
        await apiFetch("/api/akun/" + encodeURIComponent(delTarget.username), { method:"DELETE" });
      }
      setUsers(prev => prev.filter(u => u.username!==delTarget.username));
      onToast("Akun \""+delTarget.username+"\" berhasil dihapus.");
      setDelTarget(null);
    } catch(err){
      onToast("Gagal menghapus akun: " + err.message);
      setDelTarget(null);
    }
  };
  const handleUpload = async (file) => {
    if (!file) return;
    try {
      onToast("Membaca file…");
      const raw = await readSheetFile(file);
      if (!raw || raw.length===0) { onToast("File kosong atau format tidak dikenali."); return; }
      const list = raw.map(rowToAkunPayload).filter(u => u.username && String(u.username).trim());
      if (list.length===0) { onToast("Tidak ada baris valid (kolom 'username' wajib ada)."); return; }
      if (dbMode) {
        const res = await apiFetch("/api/akun/import", { method:"POST", body: JSON.stringify({ users: list }) });
        onToast("Import akun: " + (res.inserted||0) + " baru, " + (res.updated||0) + " diperbarui" + (res.failed? ", " + res.failed + " gagal":"") + ".");
        await loadUsers();
      } else {
        // tanpa DB: gabung ke state lokal (skip duplikat)
        setUsers(prev => {
          const known = new Set(prev.map(u=>u.username));
          const add = list.filter(u=>!known.has(u.username)).map(u=>({ username:u.username, name:u.name, role:u.role, nidn:u.nidn||"" }));
          return [...prev, ...add];
        });
        onToast("Import " + list.length + " akun (mode lokal, tabel akun belum ada di DB).");
      }
    } catch(err){
      onToast("Gagal import akun: " + err.message);
    }
  };

  const roleBadge = (r) => ({
    padding:"4px 10px", borderRadius:6, fontSize:11, fontWeight:700, letterSpacing:".04em",
    background: r==="admin"?"var(--okBg)":"var(--warnBg)", color: r==="admin"?"var(--okFg)":"var(--warnFgS)"
  });

  return (
    <>
      <ContentHead sync={`KELOLA AKUN · ${users.length} PENGGUNA TERDAFTAR`} title="Kelola Akun Pengguna">
        <label style={{ ...exportBtn, cursor:"pointer" }} title="Upload akun dari file Excel/CSV">
          Upload
          <input type="file" accept=".xlsx,.xls,.csv" style={{ display:"none" }}
            onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) handleUpload(f); }} />
        </label>
        <button onClick={handleAdd} style={{ ...exportBtn, marginLeft:8, background:"var(--blue)", color:"#fff", fontWeight:700 }}>+ Tambah Akun</button>
      </ContentHead>
      <p style={{ margin:"10px 0 0", fontSize:13, lineHeight:1.6, color:"var(--ink2)" }}>
        Kelola akun pengguna dashboard. Sesuai PRD, akun disiapkan langsung oleh admin (tanpa registrasi mandiri). Dosen login dengan username = nama, NIDN sebagai kunci relasional.
      </p>

      <Panel style={{ marginTop:16 }}>
        <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:14 }}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari username / nama / NIDN…" style={{
            flex:"1 1 240px", height:40, padding:"0 14px", borderRadius:9, border:"1px solid var(--bSoft)",
            background:"var(--inputBg)", color:"var(--ink)", fontSize:13, fontFamily:FONT_UI }} />
          <span style={{ fontSize:12, color:"var(--inkMuted)" }}>{filtered.length} akun</span>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
          <div style={{ display:"grid", gridTemplateColumns:"1.3fr 1fr 90px 110px 80px", gap:10, padding:"0 12px 8px", fontSize:10.5, fontWeight:700, letterSpacing:".05em", color:"var(--inkFaint)" }}>
            <span>USERNAME</span><span>NAMA</span><span>ROLE</span><span>NIDN</span><span style={{textAlign:"right"}}>AKSI</span>
          </div>
          {filtered.map((u,i)=>(
            <div key={u.username} style={{ display:"grid", gridTemplateColumns:"1.3fr 1fr 90px 110px 80px", gap:10, alignItems:"center", padding:"12px 12px", borderRadius:9, fontSize:13, color:"var(--ink)", background:i%2?"var(--panel)":"var(--panelAlt)" }}>
              <span title={u.username} style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.username}</span>
              <span title={u.name} style={{ fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.name}</span>
              <span><span style={roleBadge(u.role)}>{u.role.toUpperCase()}</span></span>
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:"var(--inkMuted)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.nidn||"—"}</span>
              <span style={{ textAlign:"right", display:"flex", gap:5, justifyContent:"flex-end" }}>
                <button onClick={()=>handleEdit(u)} title="Edit" style={{ width:30, height:28, borderRadius:6, border:0, cursor:"pointer", background:"var(--inputBg)", color:"var(--blue)", fontSize:13 }}>✎</button>
                <button onClick={()=>setDelTarget(u)} title="Hapus" disabled={u.username==="admin"} style={{ width:30, height:28, borderRadius:6, border:0, cursor:u.username==="admin"?"not-allowed":"pointer", background:"var(--warnBg)", color:u.username==="admin"?"var(--inkFaint)":"var(--danger)", fontSize:13, opacity:u.username==="admin"?.4:1 }}>✕</button>
              </span>
            </div>
          ))}
          {filtered.length===0 && <div style={{ padding:"30px 0", textAlign:"center", color:"var(--inkMuted)", fontSize:13 }}>Tidak ada akun yang cocok.</div>}
        </div>
      </Panel>

      <div style={{ marginTop:14, padding:"14px 16px", borderRadius:12, background:"var(--warnBg)", fontSize:12.5, lineHeight:1.65, color:"var(--warnFgS)" }}>
        <b style={{color:"var(--warnFg)"}}>Catatan:</b> {dbMode ? "Data akun tersambung langsung ke tabel Akun di MySQL — perubahan disimpan permanen di database." : "Tabel Akun belum ada di database, jadi perubahan sementara disimpan di localStorage browser. Jalankan pembuatan tabel Akun (mis. 002_create_akun.sql) supaya CRUD akun tersimpan permanen sesuai class diagram (username sebagai login key, NIDN sebagai FK opsional ke Dosen)."}
      </div>

      <UserFormModal open={formOpen} onClose={()=>{setFormOpen(false);setEditUser(null);}} onSave={handleSave} initial={editUser} />
      <ConfirmModal open={!!delTarget} title="Hapus Akun" message={delTarget? `Apakah Anda yakin ingin menghapus akun "${delTarget.username}" (${delTarget.name})? Tindakan ini tidak dapat dibatalkan.` : ""} onConfirm={handleDelete} onCancel={()=>setDelTarget(null)} />
    </>
  );
}

function AppShell({ role, userName, theme, setTheme, onLogout, t }) {
  const isAdmin = role === "admin";
  const [page, setPage] = useState("kpi");
  const [div, setDiv] = useState("Math");
  const [collapsed, setCollapsed] = useState(()=>{ try { return localStorage.getItem('prodi-monitor-sidebar')==='1'; } catch(e){ return false; } });
  useEffect(()=>{ try { localStorage.setItem('prodi-monitor-sidebar', collapsed?'1':'0'); } catch(e){} },[collapsed]);
  const [menuOpen, setMenuOpen] = useState(false);
  const userMenuRef = useRef(null);
  const [toast, setToast] = useState(null);
  const showToast = (m) => setToast(m);
  useEffect(()=>{ if(!toast) return; const id=setTimeout(()=>setToast(null),2400); return ()=>clearTimeout(id); },[toast]);

  // === allRows: mutable state, dipersistensi ke localStorage ===
  const [allRows, setAllRows] = useState(()=>{
    try { const s=localStorage.getItem("prodi-monitor-kpi-rows"); return s? JSON.parse(s) : PI_ROWS; } catch(e){ return PI_ROWS; }
  });
  useEffect(()=>{ try { localStorage.setItem("prodi-monitor-kpi-rows", JSON.stringify(allRows)); } catch(e){} }, [allRows]);

  // Upload/import KPI dari file (dipakai tombol Upload di dashboard & CMS).
  const handleKpiUpload = async (file) => {
    if (!file) return;
    try {
      showToast("Membaca file…");
      const raw = await readSheetFile(file);
      if (!raw || raw.length===0) { showToast("File kosong atau format tidak dikenali."); return; }
      const importRows = raw.map(r => rowToKpiPayload(r, div)).filter(r => r.name && String(r.name).trim());
      if (importRows.length===0) { showToast("Tidak ada baris valid (kolom 'Indikator' wajib ada)."); return; }
      const res = await apiFetch("/api/kpi/import?tahun=" + THN, { method:"POST", body: JSON.stringify({ rows: importRows, tahun: THN }) });
      showToast("Import: " + (res.inserted||0) + " baru, " + (res.updated||0) + " diperbarui" + (res.failed? ", " + res.failed + " gagal":"") + ".");
      // ambil ulang data live dari backend supaya baris baru langsung tampil
      if (typeof window.__fetchLiveKpiData === "function") {
        const live = await window.__fetchLiveKpiData();
        if (live && live.piRows && live.piRows.length) setAllRows(live.piRows);
      }
    } catch(err){
      showToast("Gagal import: " + err.message);
    }
  };

  const rowsMath = useMemo(()=>allRows.filter(r=>r.div==="Math"),[allRows]);
  const rowsStat = useMemo(()=>allRows.filter(r=>r.div==="Stat"),[allRows]);
  const rows = div==="Math"? rowsMath : rowsStat;

  // slot assignments per division, lifted here so admin edits reflect in viewer
  const [slotsMath, setSlotsMath] = useState(()=>defaultSlots(rowsMath));
  const [slotsStat, setSlotsStat] = useState(()=>defaultSlots(rowsStat));
  const slots = div==="Math"? slotsMath : slotsStat;
  const setSlots = div==="Math"? setSlotsMath : setSlotsStat;

  const go = (item) => {
    const key = typeof item === "string" ? item : item.key;
    const n = typeof item === "string" ? NAV.find(x=>x.key===key) : item;
    if (n?.locked) { showToast("Modul "+n.label+" menyusul setelah KPI matang."); return; }
    if (n?.adminOnly && !isAdmin) { showToast("Hanya admin yang dapat mengakses "+n.label+"."); return; }
    setPage(key); window.scrollTo({top:0});
  };

  const pageTitle = (NAV.find(n=>n.key===page)||{}).label || "";

  return (
    <div style={{ display:"flex", alignItems:"flex-start", background:"var(--pageBg)", minHeight:"100vh" }} onClick={()=>setMenuOpen(false)}>
      <Sidebar role={role} page={page} collapsed={collapsed} setCollapsed={setCollapsed} onNav={go} t={t} />

      <div style={{ flex:1, minWidth:0, display:"flex", flexDirection:"column", minHeight:"100vh" }}>
        <header style={{ position:"sticky", top:0, zIndex:20, display:"flex", alignItems:"center", gap:14,
          padding:"12px 24px", background:"var(--panel)", borderBottom:`1px solid ${t.bFaint}`, flexWrap:"wrap" }}>
          <div style={{ minWidth:0 }}>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:".06em", color:"var(--inkMuted)" }}>PRODI.MONITOR</div>
            <div style={{ fontSize:18, fontWeight:700, letterSpacing:"-.015em", color:"var(--ink)", lineHeight:1.15 }}>{pageTitle}</div>
          </div>
          <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:9 }}>
            <div style={{ display:"flex", background:"var(--inputBg)", borderRadius:9, padding:3 }}>
              {["Math","Stat"].map(d=>(
                <button key={d} onClick={()=>setDiv(d)} style={{ padding:"7px 13px", borderRadius:7, border:0, cursor:"pointer", fontSize:11.5, fontWeight:700, background: div===d?t.blue:"transparent", color: div===d?"#fff":"var(--inkMuted)", fontFamily:FONT_UI }}>{d==="Math"?"MAT":"STAT"}</button>
              ))}
            </div>
            <div style={{ background:t.gradMast, borderRadius:999, padding:3 }}><ThemeToggle theme={theme} setTheme={setTheme} t={t} /></div>
            <div style={{ position:"relative" }}>
              <button ref={userMenuRef} onClick={(e)=>{ e.stopPropagation(); setMenuOpen(o=>!o); }} style={{ display:"flex", alignItems:"center", gap:9, padding:"5px 12px 5px 5px", borderRadius:9, background:"var(--inputBg)", border:0, cursor:"pointer", color:"var(--ink)" }}>
                <span style={{ width:28, height:28, borderRadius:7, background:t.blue, color:"#fff", display:"grid", placeItems:"center", fontSize:12, fontWeight:700 }}>{isAdmin?"AP":"DV"}</span>
                <span style={{ fontSize:10.5, fontWeight:700, letterSpacing:".08em", color:"var(--inkMuted)" }}>{isAdmin?"ADMIN":"VIEWER"}</span>
              </button>
              <UserMenuPortal anchorRef={userMenuRef} open={menuOpen} onClose={()=>setMenuOpen(false)}>
                <div style={{ background:t.panel, border:`1px solid ${t.bSoft}`, borderRadius:12, boxShadow:t.shCard, minWidth:200, padding:8, fontFamily:FONT_UI }}>
                  <div style={{ padding:"10px 12px", borderBottom:`1px solid ${t.bFaint}`, marginBottom:6 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:t.ink }}>{userName}</div>
                    <div style={{ fontSize:11.5, color:t.inkMuted, marginTop:2 }}>Role: {isAdmin?"ADMIN":"VIEWER"}</div>
                  </div>
                  {isAdmin && <button onClick={()=>{setMenuOpen(false); setPage("cms"); window.scrollTo({top:0});}} style={ddItem(t)}>Atur KPI dashboard</button>}
                  <button onClick={onLogout} style={ddItem(t)}>Keluar</button>
                </div>
              </UserMenuPortal>
            </div>
          </div>
        </header>

        <div style={{ padding:"22px 24px 48px", color:"var(--ink)", flex:1 }}>
          {page==="kpi" && <KpiDashboard div={div} rows={rows} slots={slots} onToast={showToast} role={role} onUpload={handleKpiUpload} />}
          {page==="cms" && isAdmin && <KpiCmsModule div={div} rows={rows} slots={slots} setSlots={setSlots} onToast={showToast} onBack={()=>setPage("kpi")} />}
          {page==="cms" && !isAdmin && <div style={{padding:40, textAlign:"center", color:"var(--inkMuted)"}}>Hanya admin yang dapat mengatur KPI.</div>}
          {page==="kelola-kpi" && isAdmin && <KpiCrudModule div={div} allRows={allRows} setAllRows={setAllRows} onToast={showToast} />}
          {page==="kelola-kpi" && !isAdmin && <div style={{padding:40, textAlign:"center", color:"var(--inkMuted)"}}>Hanya admin yang dapat mengelola data KPI.</div>}
          {page==="kelola-akun" && isAdmin && <UserCrudModule onToast={showToast} />}
          {page==="kelola-akun" && !isAdmin && <div style={{padding:40, textAlign:"center", color:"var(--inkMuted)"}}>Hanya admin yang dapat mengelola akun.</div>}
          {page==="config" && <div style={{padding:40, textAlign:"center", color:"var(--inkMuted)"}}>Modul Config (pengaturan mapping variabel &amp; sumber data) menyusul.</div>}
        </div>
      </div>

      <div style={{ position:"fixed", bottom:24, left:"50%", transform:`translateX(-50%) translateY(${toast?0:20}px)`, background:t.inkStrong, color:t.pageBg, padding:"12px 20px", borderRadius:10, fontSize:13, fontWeight:600, boxShadow:t.shCard, opacity:toast?1:0, pointerEvents:"none", transition:"opacity .2s, transform .2s", zIndex:900, maxWidth:"90vw", textAlign:"center" }}>{toast}</div>
    </div>
  );
}const ddItem = (t) => ({ display:"block", width:"100%", textAlign:"left", padding:"9px 12px", borderRadius:8, border:0, background:"none", fontSize:13, color:t.ink2, cursor:"pointer", fontFamily:FONT_UI });
// ============================================================

//  (written by login.html); redirects back to login.html if
//  missing. Same keys/behaviour as the team's existing
//  dashboard.html.
// ============================================================
function DashboardApp() {
  const [auth, setAuth] = useState(undefined); // undefined = checking, null = redirecting
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('prodi-monitor-theme') || 'light'; } catch (e) { return 'light'; }
  });

  useEffect(() => {
    let role = null, name = '';
    try {
      role = localStorage.getItem('prodi-monitor-role');
      name = localStorage.getItem('prodi-monitor-name') || '';
    } catch (e) {}
    if (!role) { window.location.href = 'login.html'; return; }
    setAuth({ role, name });
  }, []);

  const t = theme === 'dark' ? DARK : LIGHT;
  const cssVars = `--panel:${t.panel};--panelAlt:${t.panelAlt};--panelRow:${t.panelRow};--pageBg:${t.pageBg};--inputBg:${t.inputBg};--ink:${t.ink};--ink2:${t.ink2};--inkMuted:${t.inkMuted};--inkFaint:${t.inkFaint};--blue:${t.blue};--blueDeep:${t.blueDeep};--orange:${t.orange};--link:${t.link};--okBg:${t.okBg};--okFg:${t.okFg};--okDot:${t.okDot};--warnBg:${t.warnBg};--warnFg:${t.warnFg};--warnFgS:${t.warnFgS};--warnChip:${t.warnChip};--danger:${t.danger};--bFaint:${t.bFaint};--bSoft:${t.bSoft};--gradKpi:${t.gradKpi}`;
  const styleTag = `
    @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
    .pm-root{${cssVars}}
    @keyframes pm-pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .pm-root *{box-sizing:border-box}
    .pm-root ::selection{background:${t.blue};color:#fff}
    @media (max-width:980px){ .pm-root .pm-statgrid{grid-template-columns:1fr 1fr !important} .pm-root .pm-kpicat{grid-template-columns:1fr 1fr !important} }
    @media (max-width:900px){ .pm-root .pm-row2{grid-template-columns:1fr !important} }
    @media (max-width:560px){ .pm-root .pm-statgrid{grid-template-columns:1fr !important} .pm-root .pm-kpicat{grid-template-columns:1fr !important} }
  `;

  const handleTheme = (mode) => {
    setTheme(mode);
    try { localStorage.setItem('prodi-monitor-theme', mode); } catch (e) {}
  };

  const handleLogout = () => {
    try {
      localStorage.removeItem('prodi-monitor-role');
      localStorage.removeItem('prodi-monitor-name');
    } catch (e) {}
    window.location.href = 'login.html';
  };

  if (!auth) return null; // brief blank frame while checking localStorage / redirecting

  return (
    <div className="pm-root" style={{ fontFamily: FONT_UI, background: t.bgPage, minHeight: "100vh", color: t.ink, transition: "background .25s" }}>
      <style>{styleTag}</style>
      <AppShell role={auth.role} userName={auth.name} theme={theme} setTheme={handleTheme} onLogout={handleLogout} t={t} />
    </div>
  );
}

// Dipanggil dari luar (setelah fetch API sukses) untuk menimpa data
// dummy KPI_AGG/PI_ROWS dengan data asli dari MySQL, SEBELUM di-mount.
window.__setLiveData = function(agg, piRows){
  if (agg && Object.keys(agg).length > 0) KPI_AGG = agg;
  if (piRows && piRows.length > 0) PI_ROWS = piRows;
};

window.__mountApp = function(){
  if (window.__appMounted) return;
  window.__appMounted = true;
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DashboardApp));
};

</script>

<script>
// ============================================================
// KONEKSI KE BACKEND API (MySQL)
// Ganti URL ini kalau backend dijalankan di port/host lain.
// ============================================================
var API_BASE = 'http://localhost:5000';
var TAHUN = 2026;
window.__API_BASE = API_BASE;
window.__TAHUN = TAHUN;

window.__fetchLiveKpiData = fetchLiveKpiData;
function fetchLiveKpiData() {
  var aggUrl = API_BASE + '/api/kpi/agg?tahun=' + TAHUN;
  var rowsUrl = API_BASE + '/api/kpi/pi-rows?tahun=' + TAHUN;
  return Promise.all([
    fetch(aggUrl).then(function (r) { return r.ok ? r.json() : null; }),
    fetch(rowsUrl).then(function (r) { return r.ok ? r.json() : null; })
  ]).then(function (results) {
    return { agg: results[0], piRows: results[1] };
  }).catch(function (err) {
    // Backend tidak terjangkau -> dashboard tetap jalan pakai data
    // dummy bawaan (KPI_AGG/PI_ROWS asli di app-source), tidak fatal.
    console.warn('Tidak bisa mengambil data dari backend, pakai data contoh bawaan:', err);
    return { agg: null, piRows: null };
  });
}

(function () {
  try {
    var source = document.getElementById('app-source').textContent;
    var compiled = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]]
    }).code;
    var factory = new Function('React', compiled);
    factory(React); // mendefinisikan KPI_AGG, PI_ROWS, window.__setLiveData, window.__mountApp

    fetchLiveKpiData().then(function (live) {
      if (typeof window.__setLiveData === 'function') {
        window.__setLiveData(live.agg, live.piRows);
      }
      if (typeof window.__mountApp === 'function') {
        window.__mountApp();
      }
    });
  } catch (err) {
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    box.textContent = 'Gagal memuat aplikasi:\n' + (err && err.stack ? err.stack : err);
    console.error(err);
  }
})();
</script>
